spring.application.name=SiteVerbety

# Banco de dados.
# Em producao, defina DB_URL, DB_USER e DB_PASSWORD nas variaveis de ambiente.
# Sem essas variaveis, usa o MySQL local padrao do projeto.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/siteverbety?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# O Render injeta a porta em PORT.
server.port=${PORT:8080}

# Respeita o proxy HTTPS do Render.
server.forward-headers-strategy=framework
