<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo | Verbety</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/catalogo.css" />
    <link rel="stylesheet" href="../css/nav.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo2">
        <img class="logo" src="../images/LogoFinal.png" alt="Logo Verbety" />
      </div>
      <nav class="menu-principal">
        <a href="Home.html">Início</a>
        <a href="Catalogo.html" class="ativo">Catálogo</a>
      </nav>
      <div class="auth-buttons">
        <a href="Login.html" class="btn-auth btn-black">Entrar</a>
        <a href="Cadastro.html" class="btn-auth btn-outline">Criar conta</a>
      </div>
    </header>
    <hr />
    <hr />
    <hr />

    <main class="catalogo-container">
      <h2 class="titulo-pagina">Catálogo</h2>

      <div class="filtros">
        <input type="text" id="busca" placeholder="Buscar produto..." />
        <select id="filtroCategoria">
          <option value="">Todas as categorias</option>
        </select>
      </div>

      <p id="mensagem" class="mensagem"></p>

      <div id="grid" class="grid-produtos"></div>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/catalogo.js"></script>
  </body>
</html>
