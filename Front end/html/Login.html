<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Verbety</title>
        <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/nav.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  </head>
  <body>
    
    <header class="header">
      <a href="Home.html" class="logo">Verbety</a>
    </header>

    <main class="login-container">
    

    <main class="login-container">
      <h2 class="login-title">Entrar</h2>

      
      <div class="login-toggle">
        <button id="btnCliente" class="toggle-btn active" type="button">
          Cliente
        </button>
        <button id="btnFuncionario" class="toggle-btn" type="button">
          Funcionário
        </button>
      </div>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required />

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" required />

        <p id="mensagem" class="mensagem"></p>

        <button type="submit" class="btn-login">Entrar</button>
      </form>

      <a href="Home.html" class="btn-voltar">&larr; Voltar</a>
      <p class="cadastro-link">
        Não tem conta? <a href="Cadastro.html">Cadastre-se</a>
      </p>
    </main>

    <script src="../js/login.js"></script>
  </body>
</html>
