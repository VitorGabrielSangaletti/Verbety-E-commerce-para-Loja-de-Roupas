<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Verbety</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/nav.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo2">
        <img class="logo" src="../images/LogoFinal.png" alt="Logo Verbety" />
      </div>
    </header>
    <hr />
    <hr />
    <hr />

    <main class="login-container">
      <h2 class="login-title">Criar conta</h2>

      <form id="cadastroForm">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Seu nome" required />

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" required />

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required />

        <label for="telefone">Telefone</label>
        <input
          type="text"
          id="telefone"
          placeholder="(00) 00000-0000"
          required
        />

        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          placeholder="Crie uma senha"
          required
        />

        <p id="mensagem" class="mensagem"></p>

        <button type="submit" class="btn-login">Cadastrar</button>
      </form>

      <a href="Home.html" class="btn-voltar">&larr; Voltar</a>
      <p class="cadastro-link">Já tem conta? <a href="Login.html">Entrar</a></p>
    </main>

    <script src="../js/cadastro.js"></script>
  </body>
</html>
